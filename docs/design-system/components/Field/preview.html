<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--surface-100);color:var(--ink-900);
       font-family:var(--font-sans,"Instrument Sans",system-ui,sans-serif);font-size:15px;line-height:23px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .col{display:flex;flex-direction:column;gap:12px}
  .lbl{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.08em;
       text-transform:uppercase;color:var(--ink-500);margin:0 0 8px}
  .tnum{font-variant-numeric:tabular-nums}
  .disp{font-family:var(--font-display,"Archivo",sans-serif)}
  :focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
.f{display:flex;flex-direction:column;gap:6px}
.f__lab{font-size:13px;line-height:16px;font-weight:600;letter-spacing:.02em;color:var(--ink-900);
  display:flex;align-items:center;gap:8px}
.f__req{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-500)}
.f__wrap{position:relative;display:flex;align-items:center}
.f__in{width:100%;height:44px;padding:0 12px;font-family:inherit;font-size:15px;color:var(--ink-900);
  background:var(--surface-000);border:1px solid var(--border-subtle);border-radius:var(--radius-sm)}
.f__in:hover{border-color:var(--border-strong)}
.f__wrap .f__in{padding-left:28px}
.f__prefix{position:absolute;left:12px;color:var(--ink-500);font-size:15px;pointer-events:none}
.f__suffix{position:absolute;right:12px;color:var(--ink-500);font-size:13px;pointer-events:none}
.f__wrap:has(.f__suffix) .f__in{padding-left:12px;padding-right:48px}
.f__msg{margin:0;min-height:20px;font-size:13px;line-height:20px;color:var(--ink-500)}
.f--error .f__in{border-color:var(--danger-600)}
.f__msg--error{color:var(--danger-600)}
</style>
<div class="col" style="max-width:420px">
  <div class="f">
    <label class="f__lab" for="p-loc">Locality <span class="f__req">Required</span></label>
    <input class="f__in" id="p-loc" value="New Town, Kolkata">
    <p class="f__msg">Start typing to search Kolkata localities</p>
  </div>
  <div class="f">
    <label class="f__lab" for="p-carpet">Carpet area</label>
    <div class="f__wrap">
      <input class="f__in tnum" id="p-carpet" inputmode="numeric" value="1,240">
      <span class="f__suffix">sqft</span>
    </div>
    <p class="f__msg">Carpet area only — not built-up or super area</p>
  </div>
  <div class="f f--error">
    <label class="f__lab" for="p-price">Expected price</label>
    <div class="f__wrap">
      <span class="f__prefix">₹</span>
      <input class="f__in tnum" id="p-price" inputmode="numeric" value="0">
    </div>
    <p class="f__msg f__msg--error">Enter a price above ₹1 L, or choose “Price on request”</p>
  </div>
</div>
