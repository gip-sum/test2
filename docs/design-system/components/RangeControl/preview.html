<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--surface-100);color:var(--ink-900);
       font-family:var(--font-sans,"Instrument Sans",system-ui,sans-serif);font-size:15px;line-height:23px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .col{display:flex;flex-direction:column;gap:12px}
  .lbl{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.08em;
       text-transform:uppercase;color:var(--ink-500);margin:0 0 8px}
  .tnum{font-variant-numeric:tabular-nums}
  .disp{font-family:var(--font-display,"Archivo",sans-serif)}
  :focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
.rc__track{position:relative;height:4px;background:var(--surface-200);border-radius:2px;margin:18px 10px}
.rc__fill{position:absolute;left:22%;right:42%;top:0;bottom:0;background:var(--brand-600);border-radius:2px}
.rc__h{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;background:var(--surface-000);
  border:2px solid var(--brand-600);border-radius:50%;box-shadow:var(--shadow-1)}
.rc__ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-500);
  font-variant-numeric:tabular-nums;padding:0 2px}
.rc__box{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:8px 12px;
  background:var(--surface-000);border:1px solid var(--border-subtle);border-radius:var(--radius-sm)}
.rc__cap{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-500)}
.rc__val{font-size:17px;font-weight:700;color:var(--ink-900)}
</style>
<div style="max-width:460px">
  <p class="lbl">Budget</p>
  <div class="rc">
    <div class="rc__track"><div class="rc__fill"></div><span class="rc__h" style="left:22%"></span><span class="rc__h" style="left:58%"></span></div>
    <div class="rc__ticks"><span>₹5 L</span><span>₹50 L</span><span>₹1 Cr</span><span>₹3 Cr</span><span>₹10 Cr+</span></div>
  </div>
  <div class="row" style="margin-top:14px;gap:8px">
    <div class="rc__box"><span class="rc__cap">Minimum</span><span class="rc__val tnum disp">₹ 40 L</span></div>
    <span style="color:var(--ink-500)">–</span>
    <div class="rc__box"><span class="rc__cap">Maximum</span><span class="rc__val tnum disp">₹ 62.5 L</span></div>
  </div>
  <p style="margin:12px 0 0;font-size:13px;color:var(--ink-500)">1,284 properties in this range</p>
</div>
