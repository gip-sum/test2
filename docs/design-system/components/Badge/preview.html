<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--surface-100);color:var(--ink-900);
       font-family:var(--font-sans,"Instrument Sans",system-ui,sans-serif);font-size:15px;line-height:23px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .col{display:flex;flex-direction:column;gap:12px}
  .lbl{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.08em;
       text-transform:uppercase;color:var(--ink-500);margin:0 0 8px}
  .tnum{font-variant-numeric:tabular-nums}
  .disp{font-family:var(--font-display,"Archivo",sans-serif)}
  :focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
.bdg{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:var(--radius-xs);
  font-size:12px;line-height:16px;font-weight:600;letter-spacing:.01em}
.bdg--trust{background:var(--trust-100);color:var(--trust-600)}
.bdg--brand{background:var(--brand-100);color:var(--brand-600)}
.bdg--supply{background:var(--supply-100);color:var(--supply-600)}
.bdg--ink{background:var(--surface-200);color:var(--ink-700)}
</style>
<p class="lbl">Trust &amp; compliance</p>
<div class="row" style="gap:8px">
  <span class="bdg bdg--trust"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.5l5 2.2v4c0 3.1-2.1 5.6-5 6.8-2.9-1.2-5-3.7-5-6.8v-4l5-2.2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M5.6 8.1l1.7 1.7 3.1-3.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Verified photos</span>
  <span class="bdg bdg--ink">RERA registered</span>
  <span class="bdg bdg--brand">New</span>
  <span class="bdg bdg--supply">Price reduced</span>
</div>
<p class="lbl" style="margin-top:18px">Seller type — always shown</p>
<div class="row" style="gap:8px">
  <span class="bdg bdg--ink">Owner</span>
  <span class="bdg bdg--ink">Agent · Basu Properties</span>
  <span class="bdg bdg--ink">Builder</span>
</div>
<p style="margin:18px 0 0;font-size:12px;line-height:16px;color:var(--ink-500);max-width:520px">
  <strong style="color:var(--ink-700)">Tooltip on “Verified photos”:</strong> Photos were taken at this property and checked against its location. We do not verify ownership, documents, area or price.</p>
